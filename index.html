<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">

    <title>From: Blueberry 🩵️</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(255, 255, 255, 0.95),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #ffe4ec,
                    #ffc1d2,
                    #ff9eb7
                );
        }

        /* =========================
           FLOATING HEARTS
        ========================== */

        .heart {
            position: fixed;
            bottom: -50px;

            pointer-events: none;
            user-select: none;

            opacity: 0;

            animation: floatUp linear forwards;

            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.8);

                opacity: 0;
            }

            15% {
                opacity: 0.45;
            }

            100% {
                transform:
                    translateY(-115dvh)
                    rotate(360deg)
                    scale(1.2);

                opacity: 0;
            }
        }


        /* =========================
           MAIN CARD
        ========================== */

        .card {
            position: relative;

            width: min(90%, 430px);

            padding:
                42px
                24px
                38px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(255, 255, 255, 0.7);

            border-radius: 32px;

            box-shadow:
                0 25px 60px
                rgba(150, 20, 60, 0.2),
                inset 0 1px 0
                rgba(255, 255, 255, 0.9);

            z-index: 5;
        }


        /* =========================
           TOP EMOJI
        ========================== */

        .emoji {
            font-size: 56px;
            margin-bottom: 10px;

            animation:
                heartbeat
                1.8s
                infinite;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.12);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.08);
            }

            60% {
                transform: scale(1);
            }
        }


        /* =========================
           TEXT
        ========================== */

        h1 {
            margin:
                0
                0
                10px;

            color: #b51f4d;

            font-size:
                clamp(
                    25px,
                    7vw,
                    34px
                );

            line-height: 1.25;
        }

        .subtitle {
            margin:
                0
                0
                32px;

            color: #77505d;

            font-size: 15px;
            line-height: 1.5;
        }


        /* =========================
           BUTTON AREA
        ========================== */

        .buttons {
            position: relative;

            width: 100%;
            min-height: 90px;

            display: flex;

            justify-content: center;
            align-items: flex-start;

            gap: 14px;
        }

        button {
            border: none;
            outline: none;

            min-width: 120px;
            height: 56px;

            padding:
                0
                22px;

            border-radius: 100px;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;
        }


        /* =========================
           YES BUTTON
        ========================== */

        #yesBtn {
            position: relative;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #27ae60,
                    #41d17d
                );

            box-shadow:
                0 9px 25px
                rgba(39, 174, 96, 0.3);

            z-index: 20;
        }

        #yesBtn:hover {
            filter: brightness(1.05);
        }

        #yesBtn:active {
            transform: scale(0.96);
        }


        /* =========================
           MAIHTEI BUTTON
        ========================== */

        #maihteiBtn {
            position: relative;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #f44336,
                    #ff6a64
                );

            box-shadow:
                0 9px 25px
                rgba(244, 67, 54, 0.25);

            z-index: 30;
        }

        #maihteiBtn.running {
            position: fixed;

            margin: 0;

            z-index: 50;

            transition:
                left 0.16s ease,
                top 0.16s ease,
                transform 0.15s ease;
        }


        /* =========================
           SUCCESS SCREEN
        ========================== */

        #success {
            position: fixed;
            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            padding:
                max(
                    25px,
                    env(safe-area-inset-top)
                )
                max(
                    20px,
                    env(safe-area-inset-right)
                )
                max(
                    25px,
                    env(safe-area-inset-bottom)
                )
                max(
                    20px,
                    env(safe-area-inset-left)
                );

            background:
                linear-gradient(
                    135deg,
                    #ffccd9,
                    #ff8fab
                );

            z-index: 100;
        }

        .success-card {
            width:
                min(
                    90%,
                    430px
                );

            padding:
                45px
                25px;

            text-align: center;

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            box-shadow:
                0 25px 60px
                rgba(
                    120,
                    20,
                    60,
                    0.25
                );

            animation:
                popIn
                0.45s
                ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;

                transform:
                    scale(0.7);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        .success-emoji {
            font-size: 66px;
        }

        .success-card h2 {
            margin:
                8px
                0
                10px;

            color: #c2185b;

            font-size: 30px;
        }

        .success-card p {
            margin-bottom: 20px;

            color: #704453;

            line-height: 1.6;
        }

        .whatsapp-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-top: 8px;

            padding:
                15px
                25px;

            color: white;

            background: #25D366;

            text-decoration: none;

            font-size: 17px;
            font-weight: 700;

            border-radius: 100px;

            box-shadow:
                0 8px 22px
                rgba(
                    37,
                    211,
                    102,
                    0.3
                );

            transition:
                transform
                0.18s
                ease;
        }

        .whatsapp-btn:active {
            transform:
                scale(0.96);
        }


        /* =========================
           PHONE OPTIMIZATION
        ========================== */

        @media (max-width: 480px) {

            .card {
                width: 89%;

                padding:
                    35px
                    18px
                    30px;

                border-radius: 28px;
            }

            .emoji {
                font-size: 51px;
            }

            h1 {
                font-size:
                    clamp(
                        24px,
                        7.5vw,
                        30px
                    );
            }

            .subtitle {
                margin-bottom: 27px;

                font-size: 14px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                min-width: 110px;

                height: 54px;

                padding:
                    0
                    18px;

                font-size: 16px;
            }
        }


        @media (max-width: 350px) {

            button {
                min-width: 100px;

                padding:
                    0
                    14px;

                font-size: 15px;
            }

            .buttons {
                gap: 7px;
            }
        }

    </style>
</head>


<body>

    <!-- MAIN CARD -->

    <main class="card">

        <div class="emoji">
            💍🩷
        </div>

        <h1>
            Min nei duh tawh em?
        </h1>

        <p class="subtitle">
            I thluak kha hmang la aw... 👀💕
        </p>

        <div class="buttons">

            <button
                id="yesBtn"
                type="button">
                Aw! 😍
            </button>

            <button
                id="maihteiBtn"
                type="button">
                Ka hrelole 😢
            </button>

        </div>

    </main>



    <!-- SUCCESS SCREEN -->

    <section id="success">

        <div class="success-card">

            <div class="success-emoji">
                🥰💖💍
            </div>

            <h2>
                Ka Hmangaih Che 😘💖
            </h2>

            <p>
                💖
                <br><br>
                notee.... 😌❤️
            </p>

            <a
                id="whatsappLink"
                class="whatsapp-btn"
                href="#"
                target="_blank"
                rel="noopener">
                Min lo vid call nghal rawh...🥰
            </a>

        </div>

    </section>



    <script>

        /* =========================
           ELEMENTS
        ========================== */

        const yesBtn =
            document.getElementById(
                "yesBtn"
            );

        const maihteiBtn =
            document.getElementById(
                "maihteiBtn"
            );

        const success =
            document.getElementById(
                "success"
            );

        const whatsappLink =
            document.getElementById(
                "whatsappLink"
            );


        /* =========================
           WHATSAPP SETTINGS
        ========================== */

        /*
            Put the phone number below.

            INCLUDE country code.

            DO NOT use:
            +
            spaces
            hyphens

            Example:
            919876543210
        */

        const phoneNumber = "919160526517";


        const whatsappMessage =
            "Ehemmmm 😘 Aw ka ti! 💍💕";


        /* =========================
           YES BUTTON
        ========================== */

        yesBtn.addEventListener(
            "click",
            saidYes
        );


        function saidYes() {

            success.style.display =
                "flex";


            createHeartExplosion();


            const encodedMessage =
                encodeURIComponent(
                    whatsappMessage
                );


            if (phoneNumber) {

                whatsappLink.href =
                    `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            } else {

                whatsappLink.href =
                    `https://wa.me/?text=${encodedMessage}`;

            }

        }


        /* =========================
           MAIHTEI ESCAPE SYSTEM
        ========================== */

        let escapeCount = 0;


        function moveMaihteiButton(event) {

            if (event) {

                event.preventDefault();

            }


            escapeCount++;


            maihteiBtn.classList.add(
                "running"
            );


            /*
                visualViewport is much better
                for phones because Safari and
                Chrome resize the visible area
                when their navigation bars move.
            */

            const viewport =
                window.visualViewport;


            const viewportWidth =
                viewport
                    ? viewport.width
                    : window.innerWidth;


            const viewportHeight =
                viewport
                    ? viewport.height
                    : window.innerHeight;


            /*
                Keep the button well inside
                the visible phone screen.
            */

            const paddingLeft = 22;

            const paddingRight = 22;

            const paddingTop = 55;

            const paddingBottom = 100;


            const buttonWidth =
                maihteiBtn.offsetWidth;


            const buttonHeight =
                maihteiBtn.offsetHeight;


            const minX =
                paddingLeft;


            const maxX =
                Math.max(
                    minX,
                    viewportWidth -
                    buttonWidth -
                    paddingRight
                );


            const minY =
                paddingTop;


            const maxY =
                Math.max(
                    minY,
                    viewportHeight -
                    buttonHeight -
                    paddingBottom
                );


            let x =
                minX +
                Math.random() *
                (maxX - minX);


            let y =
                minY +
                Math.random() *
                (maxY - minY);


            /*
                Avoid covering the YES button.
            */

            const yesRect =
                yesBtn.getBoundingClientRect();


            const buttonCenterX =
                x +
                buttonWidth / 2;


            const buttonCenterY =
                y +
                buttonHeight / 2;


            const yesCenterX =
                yesRect.left +
                yesRect.width / 2;


            const yesCenterY =
                yesRect.top +
                yesRect.height / 2;


            const distanceFromYes =
                Math.hypot(
                    buttonCenterX -
                    yesCenterX,

                    buttonCenterY -
                    yesCenterY
                );


            /*
                If too close to YES,
                try again.
            */

            if (distanceFromYes < 145) {

                if (
                    yesCenterX <
                    viewportWidth / 2
                ) {

                    x = maxX;

                } else {

                    x = minX;

                }


                if (
                    yesCenterY <
                    viewportHeight / 2
                ) {

                    y =
                        Math.max(
                            minY,
                            viewportHeight *
                            0.65
                        );

                } else {

                    y =
                        Math.min(
                            maxY,
                            viewportHeight *
                            0.20
                        );

                }

            }


            /*
                Final safety clamp.
                This makes sure it NEVER
                leaves the visible area.
            */

            x =
                Math.max(
                    minX,
                    Math.min(
                        x,
                        maxX
                    )
                );


            y =
                Math.max(
                    minY,
                    Math.min(
                        y,
                        maxY
                    )
                );


            maihteiBtn.style.left =
                `${x}px`;


            maihteiBtn.style.top =
                `${y}px`;


            /* =========================
               MAKE YES GROW
            ========================== */

            const yesScale =
                Math.min(
                    1 +
                    escapeCount *
                    0.045,

                    1.35
                );


            yesBtn.style.transform =
                `scale(${yesScale})`;


            /* =========================
               CHANGE MAIHTEI MESSAGE
            ========================== */

            const messages = [

                "Maihtei 😢",

                "I chiang chiah maw? 🥺",

                "In ngaihtuah tha la😭",

                "Thluak hmang leh ta? 😳",

                "Huizzzz 👀",

                "Aw ti mai la! 😂",

                "Thluak hmang lo in le..🩷"

            ];


            const messageIndex =
                Math.min(
                    escapeCount,
                    messages.length - 1
                );


            maihteiBtn.textContent =
                messages[
                    messageIndex
                ];

        }


//         =========================
//            PHONE BEHAVIOR
//         ========================== */
// 
//         
//             PHONE/TABLET:
//             It runs away only when
//             the user actually touches it.
//         */
// 
//         maihteiBtn.addEventListener(
//             "click",
//             function(event) {
// 
//                 if (
//                     event.pointerType !==
//                     "mouse"
//                 ) {
// 
//                     moveMaihteiButton(
//                         event
//                     );
// 
//                 }
// 
//             }
//         );
// 
// 
//         =========================
//            DESKTOP BEHAVIOR
//         ========================== */
// 
//         
//             COMPUTER:
//             Runs away when the mouse
//             reaches it.
//         */
// 
//         maihteiBtn.addEventListener(
//             "pointerenter",
//             function(event) {
// 
//                 if (
//                     event.pointerType ===
//                     "mouse"
//                 ) {
// 
//                     moveMaihteiButton(
//                         event
//                     );
// 
//                 }
// 
//             }
//         );

/* =========================
   MAIHTEI CLICK BEHAVIOR
========================== */

maihteiBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveMaihteiButton(event);

    }
);


        /* =========================
           KEEP BUTTON SAFE IF
           PHONE ROTATES / RESIZES
        ========================== */

        window.addEventListener(
            "resize",
            function() {

                if (
                    maihteiBtn.classList
                        .contains(
                            "running"
                        )
                ) {

                    repositionInsideScreen();

                }

            }
        );


        if (window.visualViewport) {

            window.visualViewport
                .addEventListener(
                    "resize",
                    function() {

                        if (
                            maihteiBtn
                                .classList
                                .contains(
                                    "running"
                                )
                        ) {

                            repositionInsideScreen();

                        }

                    }
                );

        }


        function repositionInsideScreen() {

            const viewport =
                window.visualViewport;


            const width =
                viewport
                    ? viewport.width
                    : window.innerWidth;


            const height =
                viewport
                    ? viewport.height
                    : window.innerHeight;


            const paddingX = 22;

            const paddingTop = 55;

            const paddingBottom = 100;


            const buttonWidth =
                maihteiBtn.offsetWidth;


            const buttonHeight =
                maihteiBtn.offsetHeight;


            let currentX =
                parseFloat(
                    maihteiBtn.style.left
                ) || paddingX;


            let currentY =
                parseFloat(
                    maihteiBtn.style.top
                ) || paddingTop;


            const maxX =
                Math.max(
                    paddingX,
                    width -
                    buttonWidth -
                    paddingX
                );


            const maxY =
                Math.max(
                    paddingTop,
                    height -
                    buttonHeight -
                    paddingBottom
                );


            currentX =
                Math.max(
                    paddingX,
                    Math.min(
                        currentX,
                        maxX
                    )
                );


            currentY =
                Math.max(
                    paddingTop,
                    Math.min(
                        currentY,
                        maxY
                    )
                );


            maihteiBtn.style.left =
                `${currentX}px`;


            maihteiBtn.style.top =
                `${currentY}px`;

        }


        /* =========================
           FLOATING HEARTS
        ========================== */

        function createHeart() {

            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            const hearts = [

                "❤️",
                "💕",
                "💖",
                "💗",
                "💘"

            ];


            heart.textContent =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                Math.random() *
                100 +
                "vw";


            heart.style.fontSize =
                14 +
                Math.random() *
                24 +
                "px";


            heart.style.animationDuration =
                5 +
                Math.random() *
                5 +
                "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                10000
            );

        }


        setInterval(
            createHeart,
            700
        );


        /* =========================
           YES HEART EXPLOSION
        ========================== */

        function createHeartExplosion() {

            for (
                let i = 0;
                i < 40;
                i++
            ) {

                setTimeout(
                    createHeart,
                    i * 35
                );

            }

        }

    </script>

</body>
</html>
